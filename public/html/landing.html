<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HIStore'y - Landing</title>
  <style>
    :root{--gold:#d4b05a;--maroon:#8b0b0b;--bg1:#4d3f2f;--bg2:#3d3024}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter, Arial, Helvetica, sans-serif;background:linear-gradient(180deg,var(--bg1),var(--bg2));color:#fff}
    header{padding:18px 0;background:transparent}
    header .inner{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:24px;padding:0 24px}
    .logo{display:flex;align-items:center;gap:16px}
    .logo img{height:56px}
    .search{display:flex;justify-content:center}
    .search input{width:60%;max-width:720px;padding:14px 24px;border-radius:32px;border:none;box-shadow:0 6px 18px rgba(0,0,0,0.5)}
    .actions{display:flex;align-items:center;gap:12px}
    .actions button{background:#fff;color:#222;border-radius:28px;padding:10px 18px;border:none}
    .nav{background:var(--maroon);padding:12px 0;color:#fff}
    .nav .container{max-width:1200px;margin:0 auto;display:flex;gap:60px;padding:0 16px;justify-content:center}
    .nav .container a{color:#ffffff;text-decoration:none;text-transform:uppercase;font-weight:700;font-size:16px;letter-spacing:1px;padding:8px 6px}
    .nav .container a:hover{opacity:0.9}
    .page-content{max-width:1200px;margin:0 auto;padding:0 24px 80px}
    .hero{position:relative;display:flex;align-items:center;justify-content:space-between;padding:80px 56px 40px;margin:0 auto}
    .hero .left{max-width:56%}
    .hero h1{font-size:96px;margin:0 0 18px;color:#fff;text-shadow:0 8px 26px rgba(0,0,0,0.65);letter-spacing:2px}
    .hero .logo-img{max-width:420px;width:100%;height:auto;display:block}
    .hero .logo-img.small{max-width:260px}
    .hero p{font-size:20px;opacity:0.95;line-height:1.4}
    .cta{margin-top:24px}
    .cta a{display:inline-block;background:#fff;color:#222;padding:14px 28px;border-radius:40px;text-decoration:none;font-weight:600}
    .hero .right{position:relative;width:480px;height:auto;padding:0;background:transparent;overflow:visible;display:flex;align-items:center;justify-content:center}
    .hero .right img{position:relative;max-width:420px;width:100%;height:auto;object-fit:contain;border-radius:6px;box-shadow:0 18px 40px rgba(0,0,0,0.6)}
    /* small screens */
    @media(max-width:900px){
      .search input{width:90%}
      .hero{flex-direction:column;gap:20px;padding:40px 20px}
      .hero .left{max-width:100%;text-align:center}
      .hero h1{font-size:48px}
      .hero .right{width:100%;height:auto;padding:0}
      .hero .right img{position:relative;right:auto;bottom:auto;margin:0 auto;display:block;width:80%;height:auto;object-fit:contain;border-radius:6px}
    }
    .mute-btn{position:fixed;right:20px;top:20px;background:rgba(255,255,255,0.95);border-radius:50%;width:52px;height:52px;display:flex;align-items:center;justify-content:center;border:none;box-shadow:0 6px 18px rgba(0,0,0,0.4);font-size:18px}
    footer{padding:28px 0;background:rgba(0,0,0,0.12);color:#ddd;position:fixed;left:0;right:0;bottom:0;font-size:20px}
    /* ensure page content isn't hidden behind fixed footer */
    .page-pad{height:110px}
  </style>
</head>
<body>
  <header>
    <div class="inner">
      <div class="logo">
        <img src="/media/images/LogoWhite.png" alt="logo">
      </div>
      <div class="search">
        <input placeholder="Search here" aria-label="search" />
      </div>
      <div class="actions">
        <button onclick="location.href='/home'">Start Shopping</button>
        <button onclick="location.href='/login'">Sign In</button>
      </div>
    </div>
  </header>
  <div class="nav">
    <div class="container">
      <a href="#" aria-label="Products">PRODUCTS</a>
      <a href="#" aria-label="HIStory">HIS STORY</a>
      <a href="#" aria-label="MJ Minigame">MJ MINIGAME</a>
    </div>
  </div>

  <div class="page-content">
    <section class="hero">
    <div class="left">
      <img src="/media/images/LogoWhite.png" alt="HIStore'y" class="logo-img" />
      <p style="font-size:20px;opacity:0.95;max-width:600px">Get the fan essentials — exclusive Michael Jackson memorabilia curated for collectors.</p>
      <div class="cta"><a href="/home">Start Shopping</a></div>
    </div>
    <div class="right">
      <img src="/media/images/land_pg/landingmerch.png" alt="landing image">
    </div>
    </section>
  </div>

  <div class="page-pad"></div>

  <button id="mute" class="mute-btn" aria-pressed="false">🔊</button>

  <audio id="bg-audio" src="/media/songs/mj_landing.mp3" loop autoplay playsinline preload="auto"></audio>

  <footer>
    <div style="max-width:1100px;margin:0 auto;display:flex;justify-content:center"><div>Copyright 2026 HIStore'y E-commerce</div></div>
  </footer>

  <script src="/public/js/landing.js"></script>
</body>
</html>
