<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HIStorey | Admin Users</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css">
  <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f5f5f5; color: #222; }
    .shell { max-width: 1200px; margin: 0 auto; padding: 24px; }
    .card { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.08); }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .actions a, .actions button { text-decoration: none; background: #222; color: #fff; padding: 10px 14px; border-radius: 8px; border: none; cursor: pointer; }
    form { display: grid; gap: 10px; margin-bottom: 16px; }
    form input, form select { padding: 10px; border: 1px solid #ccc; border-radius: 8px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="card">
      <div class="topbar">
        <h1>User Management</h1>
        <div class="actions">
          <a href="/admin">Back to dashboard</a>
          <button id="toggleUserForm">Create user</button>
        </div>
      </div>

      <form id="userForm" class="hidden">
        <input type="text" id="userName" placeholder="Full name" required />
        <input type="email" id="userEmail" placeholder="Email" required />
        <input type="password" id="userPassword" placeholder="Password" required />
        <select id="userRole">
          <option value="customer">Customer</option>
          <option value="admin">Admin</option>
        </select>
        <button type="submit">Save user</button>
      </form>

      <table id="userTable" class="display" style="width:100%">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Phone</th>
            <th>Status</th>
            <th>Created</th>
            <th>Actions</th>
          </tr>
        </thead>
      </table>
    </div>
  </div>

  <script src="/public/js/user.js"></script>
</body>
</html>
