<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HIStorey | Admin Orders</title>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css" />
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f5f5f5; color: #222; }
    .shell { max-width: 1200px; margin: 0 auto; padding: 24px; }
    .card { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.08); }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .actions a { text-decoration: none; background: #222; color: #fff; padding: 10px 14px; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="card">
      <div class="topbar">
        <h1>Order Management</h1>
        <div class="actions"><a href="/admin">Back to dashboard</a></div>
      </div>
      <table id="ordersTable" class="display" style="width:100%">
        <thead>
          <tr>
            <th>ID</th><th>Email</th><th>Total</th><th>Status</th><th>Updated</th>
          </tr>
        </thead>
      </table>
    </div>
  </div>
  <script src="/public/js/admin-orders.js"></script>
</body>
</html>
