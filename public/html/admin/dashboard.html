<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HIStorey | Admin</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f5f5f5; color: #222; }
    .shell { max-width: 1200px; margin: 0 auto; padding: 24px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px; }
    .nav { display: flex; gap: 10px; flex-wrap: wrap; }
    .nav a { text-decoration: none; background: #222; color: #fff; padding: 8px 12px; border-radius: 8px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 20px; }
    .card { background: #fff; border-radius: 12px; padding: 18px; box-shadow: 0 8px 24px rgba(0,0,0,.08); }
    .metric { font-size: 1.8rem; font-weight: 700; margin-top: 8px; }
    .chart-wrap { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
    canvas { width: 100%; height: 240px; }
    .range { display: flex; gap: 8px; margin-bottom: 12px; }
    .range button { border: 1px solid #ccc; background: #fff; padding: 6px 10px; border-radius: 8px; cursor: pointer; }
    .range button.active { background: #222; color: #fff; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 8px; border-bottom: 1px solid #eee; text-align: left; }
    @media (max-width: 900px) { .chart-wrap { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="shell">
    <div class="topbar">
      <h1>Admin Dashboard</h1>
      <div class="nav">
        <a href="/home">Storefront</a>
        <a href="/admin/users">Users</a>
        <a href="/admin/products">Products</a>
        <a href="/admin/orders">Orders</a>
        <button id="logoutButton" type="button" style="border:none; background:#c0392b; color:#fff; padding:8px 12px; border-radius:8px; cursor:pointer;">Logout</button>
      </div>
    </div>

    <section class="grid">
      <div class="card"><div>Total Sales</div><div class="metric" id="salesValue">$0.00</div></div>
      <div class="card"><div>Active Users</div><div class="metric" id="usersValue">0</div></div>
      <div class="card"><div>Total Products</div><div class="metric" id="productsValue">0</div></div>
      <div class="card"><div>Pending Orders</div><div class="metric" id="ordersValue">0</div></div>
    </section>

    <section class="card">
      <div class="range">
        <button class="active" data-range="daily">Daily</button>
        <button data-range="weekly">Weekly</button>
        <button data-range="monthly">Monthly</button>
        <button data-range="yearly">Yearly</button>
      </div>
      <div class="chart-wrap">
        <div><canvas id="revenueChart"></canvas></div>
        <div><canvas id="roleChart"></canvas></div>
      </div>
    </section>

    <section class="card" style="margin-top:16px;">
      <h3>Top Selling Items</h3>
      <table>
        <thead><tr><th>Item</th><th>Units</th><th>Revenue</th></tr></thead>
        <tbody id="topItems"></tbody>
      </table>
    </section>
  </main>

  <script src="/public/js/admin-dashboard.js"></script>
</body>
</html>
