<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HIStorey | Admin Products</title>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css" />
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f5f5f5; color: #222; }
    .shell { max-width: 1200px; margin: 0 auto; padding: 24px; }
    .card { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.08); }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; }
    .actions button, .actions a { border: none; background: #222; color: #fff; padding: 10px 14px; border-radius: 8px; cursor: pointer; text-decoration: none; }
    form { display: grid; gap: 10px; margin-top: 16px; }
    form input, form select, form textarea { padding: 10px; border: 1px solid #ccc; border-radius: 8px; }
    .hidden { display: none; }
    .prod-thumb { width:96px; height:96px; object-fit:cover; border-radius:6px; margin-right:8px; cursor:pointer; border:1px solid #ddd }
    #imageModal { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,0.6); z-index:10000 }
    #imageModal img { max-width:90%; max-height:90%; border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,.5) }
    #imageModal .close { position:absolute; top:20px; right:24px; color:#fff; font-size:24px; cursor:pointer }
    #imageModal div {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #f5f5f5;
      border: 1px solid #ccc;
      border-radius: 6px;
      z-index: 10;
      display: none;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="card">
      <div class="topbar">
        <h1>Product Management</h1>
        <div class="actions">
          <a href="/admin">Back to dashboard</a>
          <button id="toggleForm">Add product</button>
        </div>
      </div>

      <form id="productForm" class="hidden">
        <input type="hidden" id="productId" />
        <input type="text" id="productName" placeholder="Product name" required />
        <input type="number" id="productPrice" placeholder="Price" step="0.01" required />
        <input type="text" id="productCategory" placeholder="Category" value="General" />
        <textarea id="productDescription" placeholder="Description"></textarea>
        <input type="number" id="productStock" placeholder="Stock" value="0" />
        <input type="file" id="productImages" name="images" multiple accept="image/*" />
        <div id="productImagesPreview" style="display:flex;gap:8px;margin-top:8px"></div>
        <button type="submit">Save product</button>
      </form>

      <table id="productsTable" class="display" style="width:100%">
        <thead>
          <tr>
            <th>ID</th><th>Name</th><th>Images</th><th>Price</th><th>Category</th><th>Stock</th><th>Status</th><th>Actions</th>
          </tr>
        </thead>
      </table>
    </div>
  </div>

  <div id="imageModal">
    <div class="close" onclick="closeImageModal()">✕ Close</div>
    <img src="" alt="preview" />
  </div>

  <script src="/public/js/admin-products.js"></script>
</body>
</html>
