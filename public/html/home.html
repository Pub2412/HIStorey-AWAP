<!doctype html>
<html>
<head>
	<meta charset="utf-8" />
	<title>HIStorey - Mockup</title>
	<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
	<style>
		body { font-family: Arial, Helvetica, sans-serif; margin: 20px }
		.search-box { margin-bottom: 12px }
		.page-header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 16px;
			margin-bottom: 24px;
			padding-bottom: 14px;
			border-bottom: 1px solid #ddd;
		}
		.page-brand {
			font-size: 1.8rem;
			font-weight: 700;
			margin: 0;
		}
		.page-actions {
			display: flex;
			align-items: center;
			gap: 10px;
		}
		.header-button {
			display: inline-block;
			padding: 10px 16px;
			border-radius: 8px;
			text-decoration: none;
			font-weight: 700;
			border: 1px solid #222;
			color: #222;
			background: #fff;
			font: inherit;
			cursor: pointer;
		}
		.header-button.primary {
			background: #222;
			color: #fff;
		}
		.user-greeting {
			font-weight: 700;
			color: #222;
		}
	</style>
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
	<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
</head>
<body>
	<header class="page-header">
		<h1 class="page-brand">HIStorey - Mockup UI</h1>
		<div class="page-actions" id="authActions"></div>
	</header>

	<section>
		<h2>Search / Autocomplete</h2>
		<input id="search" class="search-box" placeholder="Search products..." />
		<div id="suggestions"></div>
	</section>

	<section>
		<h2>Products (DataTable)</h2>
		<button id="addProduct" hidden>Add product</button>
		<table id="productsTable" class="display" style="width:100%">
			<thead><tr><th>ID</th><th>Name</th><th>Price</th><th>Actions</th></tr></thead>
			<tbody></tbody>
		</table>
	</section>

	<section>
		<h2>Transactions</h2>
		<form id="txForm">
			<label>Email: <input name="email" /></label>
			<label>Total: <input name="total" type="number" /></label>
			<button type="submit">Create Transaction</button>
		</form>
		<div id="txResult"></div>
	</section>

	<script src="/public/js/home.js"></script>
</body>
</html>
